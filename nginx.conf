server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the single-page bundle (fonts/CDN stay remote)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache immutable-ish assets if ever added; HTML itself never cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Quiet 404s for files referenced by the template but not shipped yet
    location ~* \.(ico|jpg|jpeg|png|svg|webp)$ {
        log_not_found off;
        try_files $uri =404;
    }

    # Healthcheck endpoint for Coolify / Traefik
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
